name: Release from pinned version

on:
  push:
    branches:
      - main
    paths:
      - pkgs/grok-cli.nix
      - .github/workflows/release-from-pin.yml
  pull_request_target:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-from-pin
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name != 'pull_request_target' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'chore/grok-cli-')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # On pull_request_target closed events, ensure we read the latest main pin.
          ref: refs/heads/main

      - name: Read pinned Grok CLI version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 -c 'import pathlib,re,sys; t=pathlib.Path("pkgs/grok-cli.nix").read_text(); m=re.search(r"version\s*=\s*\"([^\"]+)\"\s*;", t); print(m.group(1) if m else sys.exit("Could not parse version in pkgs/grok-cli.nix"))')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse GitHub release
        id: release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const version = process.env.VERSION;

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release already exists: ${existing.data.html_url}`);
              core.setOutput("url", existing.data.html_url);
            } catch (error) {
              if (error.status !== 404) throw error;

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body: `Automated release for Grok CLI ${version}.`,
                draft: false,
                prerelease: false,
                generate_release_notes: true
              });

              core.info(`Created release: ${created.data.html_url}`);
              core.setOutput("url", created.data.html_url);
            }

      - name: Print release URL
        run: 'echo "Release URL: ${{ steps.release.outputs.url }}"'

      - name: Prune old bump branches (keep latest 5)
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prefix = "chore/grok-cli-";
            const keepCount = 5;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            const bumpBranches = branches.filter((b) => b.name.startsWith(prefix));
            if (bumpBranches.length <= keepCount) {
              core.info(`Nothing to prune: found ${bumpBranches.length} bump branches (<= ${keepCount}).`);
              return;
            }

            const branchMetadata = [];
            for (const branch of bumpBranches) {
              try {
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: branch.name
                });

                const dateRaw =
                  commit?.commit?.committer?.date ||
                  commit?.commit?.author?.date ||
                  "1970-01-01T00:00:00Z";
                branchMetadata.push({
                  name: branch.name,
                  timestamp: Number(new Date(dateRaw)) || 0
                });
              } catch (error) {
                core.warning(`Skipping branch '${branch.name}' due to metadata read error: ${error}`);
              }
            }

            branchMetadata.sort((a, b) => b.timestamp - a.timestamp);
            const keepSet = new Set(branchMetadata.slice(0, keepCount).map((item) => item.name));
            const pruneCandidates = branchMetadata.filter((item) => !keepSet.has(item.name));

            if (pruneCandidates.length === 0) {
              core.info("No branches eligible for pruning after ranking.");
              return;
            }

            for (const candidate of pruneCandidates) {
              try {
                const { data: openPrs } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: "open",
                  head: `${owner}:${candidate.name}`,
                  per_page: 1
                });

                if (openPrs.length > 0) {
                  core.info(`Keeping '${candidate.name}' because it has an open PR.`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${candidate.name}`
                });
                core.info(`Deleted old bump branch '${candidate.name}'.`);
              } catch (error) {
                core.warning(`Failed to delete branch '${candidate.name}': ${error}`);
              }
            }
