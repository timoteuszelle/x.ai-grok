name: Auto-merge Grok CLI bump PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - ready_for_review
  check_suite:
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Use check_suite id when available so multiple bump PRs in one suite don't interfere.
  group: automerge-grok-cli-bumps-${{ github.event.pull_request.number || github.event.check_suite.id || github.event.check_suite.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for eligible bump PRs
        uses: actions/github-script@v8
        with:
          script: |
            const TITLE_PATTERN = /^chore: bump grok-cli to \d+\.\d+\.\d+(?:[.-][0-9A-Za-z._-]+)?$/;
            const BRANCH_PATTERN = /^chore\/grok-cli-\d+\.\d+\.\d+(?:[.-][0-9A-Za-z._-]+)?$/;
            const REQUIRED_LABEL = "automerge";
            const ALLOWED_AUTHORS = new Set(["github-actions[bot]"]);

            async function getCandidatePRs() {
              if (context.payload.pull_request) {
                return [context.payload.pull_request];
              }
              const refs = context.payload.check_suite?.pull_requests ?? [];
              if (refs.length === 0) return [];
              const pulls = await Promise.all(
                refs.map((ref) =>
                  github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: ref.number
                  })
                )
              );
              return pulls.map((p) => p.data);
            }

            const candidates = await getCandidatePRs();
            if (candidates.length === 0) {
              core.info("No pull request associated with this event.");
              return;
            }

            for (const candidate of candidates) {
              try {
                // Always fetch a fresh copy so all gates (including label) see current state.
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: candidate.number
                });

                if (pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                  core.info(`Skipping PR #${pr.number}: different base repository.`);
                  continue;
                }

                if (!pr.user || !ALLOWED_AUTHORS.has(pr.user.login)) {
                  core.info(`Skipping PR #${pr.number}: author '${pr.user?.login}' is not allowed.`);
                  continue;
                }

                if (!TITLE_PATTERN.test(pr.title || "")) {
                  core.info(`Skipping PR #${pr.number}: title does not match bump pattern.`);
                  continue;
                }

                if (!pr.head || !BRANCH_PATTERN.test(pr.head.ref || "")) {
                  core.info(`Skipping PR #${pr.number}: branch does not match bump pattern.`);
                  continue;
                }

                if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                  core.info(`Skipping PR #${pr.number}: head branch is not in this repository.`);
                  continue;
                }

                if (pr.state !== "open" || pr.draft) {
                  core.info(`Skipping PR #${pr.number}: PR is not open and ready for merge.`);
                  continue;
                }

                const labelNames = (pr.labels ?? []).map((l) => l.name);
                if (!labelNames.includes(REQUIRED_LABEL)) {
                  core.info(`Skipping PR #${pr.number}: missing required label '${REQUIRED_LABEL}'.`);
                  continue;
                }

                if (pr.auto_merge) {
                  core.info(`Auto-merge already enabled for PR #${pr.number}.`);
                  continue;
                }

                if (pr.mergeable === false) {
                  core.info(
                    `Skipping PR #${pr.number}: mergeable=${pr.mergeable}, mergeable_state=${pr.mergeable_state}.`
                  );
                  continue;
                }

                if (pr.mergeable_state === "clean") {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    merge_method: "merge",
                    sha: pr.head.sha
                  });
                  core.info(`Merged eligible PR #${pr.number} immediately.`);
                  continue;
                }

                try {
                  await github.graphql(
                    `
                      mutation EnableAutoMerge($pullRequestId: ID!) {
                        enablePullRequestAutoMerge(
                          input: {
                            pullRequestId: $pullRequestId
                            mergeMethod: MERGE
                          }
                        ) {
                          pullRequest {
                            number
                            autoMergeRequest {
                              enabledAt
                            }
                          }
                        }
                      }
                    `,
                    { pullRequestId: pr.node_id }
                  );

                  core.info(`Enabled auto-merge for PR #${pr.number}.`);
                } catch (err) {
                  const graphqlErrors = Array.isArray(err?.errors) ? err.errors : [];
                  const alreadyClean = graphqlErrors.some((entry) =>
                    typeof entry?.type === "string" &&
                    entry.type.toUpperCase() === "UNPROCESSABLE" &&
                    entry?.message === "Pull request Pull request is in clean status" &&
                    Array.isArray(entry?.path) &&
                    entry.path.includes("enablePullRequestAutoMerge")
                  );
                  if (alreadyClean) {
                    await github.rest.pulls.merge({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number,
                      merge_method: "merge",
                      sha: pr.head.sha
                    });
                    core.info(`Merged eligible PR #${pr.number} after clean-status response.`);
                    continue;
                  }
                  throw err;
                }
              } catch (err) {
                core.error(`Failed to process PR #${candidate.number}: ${err}`);
                // Continue with other PRs (important for check_suite events with multiple PRs).
              }
            }
