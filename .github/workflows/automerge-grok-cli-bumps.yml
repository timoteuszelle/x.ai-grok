name: Auto-merge Grok CLI bump PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - ready_for_review
  check_suite:
    types:
      - completed
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-grok-cli-bumps-${{ github.event.pull_request.number || github.event.check_suite.id }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for eligible bump PRs
        uses: actions/github-script@v8
        with:
          script: |
            const titlePattern = /^chore: bump grok-cli to \d+\.\d+\.\d+(?:[.-][0-9A-Za-z._-]+)?$/;
            const branchPattern = /^chore\/grok-cli-\d+\.\d+\.\d+(?:[.-][0-9A-Za-z._-]+)?$/;
            const requiredLabel = "automerge";
            const allowedAuthors = new Set(["github-actions[bot]"]);

            async function getPullRequest() {
              if (context.payload.pull_request) {
                return context.payload.pull_request;
              }

              const pullRefs = context.payload.check_suite?.pull_requests ?? [];
              if (pullRefs.length === 0) return null;

              const prRef = pullRefs[0];
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prRef.number
              });
              return pr;
            }

            const pr = await getPullRequest();
            if (!pr) {
              core.info("No pull request associated with this event.");
              return;
            }

            if (pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info(`Skipping PR #${pr.number}: different base repository.`);
              return;
            }

            if (!allowedAuthors.has(pr.user.login)) {
              core.info(`Skipping PR #${pr.number}: author '${pr.user.login}' is not allowed.`);
              return;
            }

            if (!titlePattern.test(pr.title)) {
              core.info(`Skipping PR #${pr.number}: title '${pr.title}' does not match bump pattern.`);
              return;
            }

            if (!branchPattern.test(pr.head.ref)) {
              core.info(`Skipping PR #${pr.number}: branch '${pr.head.ref}' does not match bump pattern.`);
              return;
            }

            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info(`Skipping PR #${pr.number}: head branch is not in this repository.`);
              return;
            }

            if (pr.state !== "open" || pr.draft) {
              core.info(`Skipping PR #${pr.number}: PR is not open and ready for merge.`);
              return;
            }

            const labelNames = (pr.labels ?? []).map((label) => label.name);
            if (!labelNames.includes(requiredLabel)) {
              core.info(`Skipping PR #${pr.number}: missing required label '${requiredLabel}'.`);
              return;
            }

            const { data: latestPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            if (latestPr.auto_merge) {
              core.info(`Auto-merge already enabled for PR #${latestPr.number}.`);
              return;
            }

            if (latestPr.mergeable === false || latestPr.mergeable_state !== "clean") {
              core.info(
                `Skipping PR #${latestPr.number}: mergeable=${latestPr.mergeable}, mergeable_state=${latestPr.mergeable_state}.`
              );
              return;
            }

            await github.graphql(
              `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(
                    input: {
                      pullRequestId: $pullRequestId
                      mergeMethod: MERGE
                    }
                  ) {
                    pullRequest {
                      number
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }
              `,
              { pullRequestId: latestPr.node_id }
            );

            core.info(`Enabled auto-merge for PR #${latestPr.number}.`);
